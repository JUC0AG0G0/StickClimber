<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StickClimber</title>
    <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
    <!-- TOUT le menu vit dans la scène 3D (panneaux et boutons cliquables
         via raycasting). Le HTML ne porte plus que le HUD de jeu et une
         ligne d'aide. -->
    <canvas id="game-canvas"></canvas>

    <p id="menu-hint" class="hint">Souris ou manette · ✕ valider · ○ retour</p>

    <div id="game-ui" class="hidden">
        <div id="score-display">Score : 0</div>
        <button id="btn-quit" class="quit-btn">Menu ▸ (Options)</button>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
